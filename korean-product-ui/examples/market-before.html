<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중고거래 상세 — 지시 없이 만든 화면</title>
<!-- 비교용: 아무 지시 없이 만들었을 때 흔히 나오는 화면을 재현했다. 일부러 틀린 곳이 많다. -->
<style>
  body { margin: 0; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; background: #f8fafc; color: #0f172a; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .hero { background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%); padding: 32px 24px 80px; text-align: center; color: #fff; }
  .hero h1 { margin: 0; font-size: 30px; line-height: 1.2; }
  .hero p { margin: 8px 0 0; opacity: .85; font-size: 15px; }
  .photo { margin: -56px 24px 0; padding: 12px; border-radius: 28px; background: rgba(255,255,255,.6); backdrop-filter: blur(12px); box-shadow: 0 20px 40px rgba(79,70,229,.25); }
  .photo img { width: 100%; border-radius: 20px; display: block; }
  .card { margin: 20px 24px; padding: 20px; background: #fff; border-radius: 24px; box-shadow: 0 10px 30px rgba(15,23,42,.08); text-align: center; }
  .price { font-size: 32px; font-weight: 800; background: linear-gradient(90deg, #7c3aed, #4f46e5); -webkit-background-clip: text; color: transparent; }
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 24px; }
  .feature { padding: 16px 8px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(15,23,42,.08); text-align: center; font-size: 13px; }
  .feature .ic { font-size: 24px; }
  .desc { width: 300px; margin: 0 auto; font-size: 15px; line-height: 1.3; text-align: left; }
  .muted { color: #cbd5e1; font-size: 13px; }
  .tiny { font-size: 10px; color: #94a3b8; }
  .cta { display: block; margin: 24px; padding: 18px; border: 0; border-radius: 999px; width: calc(100% - 48px); background: linear-gradient(90deg, #7c3aed, #4f46e5); color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 10px 30px rgba(124,58,237,.4); }
  .consent { margin: 0 24px; font-size: 13px; }
  .skip { display: block; text-align: center; color: #94a3b8; font-size: 12px; margin: 8px 0 32px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>✨ 빈티지 필름카메라 ✨</h1>
    <p>당신의 추억을 더욱 특별하게 만들어 줄 완벽한 선택!</p>
  </div>
  <div class="photo"><img src="assets/camera.jpg" alt=""></div>

  <div class="card">
    <div class="price">145000원</div>
    <p class="muted">판매자에게 문의하실 수 있습니다.</p>
  </div>

  <div class="features">
    <div class="feature"><div class="ic">📦</div>배송 가능</div>
    <div class="feature"><div class="ic">💳</div>안전결제</div>
    <div class="feature"><div class="ic">⭐</div>평점 4.9</div>
  </div>

  <div class="card">
    <p class="desc">상태 좋아요! 셔터 속도 전 구간 정상 작동하며 노출계도 잘 작동합니다. 렌즈에는 미세한 헤어라인 스크래치가 있지만 사진에는 영향이 없습니다. 다양한 촬영을 쉽고 빠르게 시작해보세요!</p>
    <p class="muted">조회 312 · 관심 18</p>
  </div>

  <button class="cta" type="button">지금 바로 채팅하기 🚀</button>
  <p class="consent"><label><input type="checkbox" checked> 가격 알림 및 마케팅 정보 수신 동의 (선택)</label></p>
  <p class="tiny" style="text-align:center">아래 버튼을 클릭하여 판매자에게 문의하세요</p>
  <a class="skip" href="#">관심 없어요, 좋은 물건 놓칠게요</a>
</div>
</body>
</html>
