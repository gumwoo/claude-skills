<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>규칙마다 하나씩 틀린 화면</title>
<style>
body{margin:0;font-family:Arial, Helvetica;}
.hero{background:linear-gradient(135deg,#6d28d9,#4f46e5);color:#fff;padding:24px}
h1{font-size:32px;margin:0}
.desc{width:150px;font-size:15px;line-height:1.2}
.wide{width:600px;height:20px;background:#eee}
.muted{color:#bbb;font-size:13px}
.tiny{font-size:10px}
.ic{width:24px;height:24px;display:inline-block}
</style></head>
<body>
<div class="hero"><h1>새로운 경험을 시작하세요</h1></div>
<p class="desc">당신의 일상을 더욱 특별하게 만들어주는 다양한 서비스를 지금 바로 만나보세요</p>
<p>가격 45000원, 누적 회원 12000명</p>
<p>아래 버튼을 클릭하세요 🚀</p>
<p>정보가 저장되어집니다. 다음 단계로 넘어갈게요.</p>
<p class="muted">흐린 안내 문구입니다</p>
<p class="tiny">작은 글씨 약관</p>
<div class="wide"></div>
<label><input type="checkbox" checked> 마케팅 정보 수신 동의(선택)</label>
<button class="ic">x</button>
<a href="#">혜택 포기하기</a>
</body></html>
