<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오탐이 나면 안 되는 경우들</title>
<link rel="stylesheet" href="../../templates/tokens.css">
<style>
  .narrow { width: 150px; }
  .photo { position: relative; width: 200px; height: 120px; background: url("../../examples/assets/room-study.jpg") center/cover; }
  .badge { position: absolute; right: 8px; bottom: 8px; padding: 2px 8px; border-radius: 99px; background: rgb(0 0 0 / .6); color: #fff; font-size: 12px; }
  .chip { display: inline-flex; align-items: center; height: 44px; padding: 0 12px; border: 0; border-radius: 99px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  h1 { width: 200px; font-size: 22px; line-height: 1.3; }
  .pill { display: inline-flex; align-items: center; min-height: 44px; line-height: 1.2; }
</style></head>
<body>
  <!-- keep-all이 걸린 좁은 문단: 어절 중간 줄바꿈이 없어야 한다 -->
  <p class="narrow">예약을 취소하면 결제한 금액을 영업일 기준 사흘 안에 돌려드려요.</p>
  <!-- 연도, 전화번호, 쉼표 있는 금액: num-comma가 나오면 안 된다 -->
  <p>2026년 11월 23일 · 1,200원 · 고객센터 1500-0000 · 주문번호 20261123</p>
  <!-- 사진 위 반투명 배지: 섞은 배경으로 대비를 계산해야 한다 -->
  <div class="photo"><span class="badge">1 / 8</span></div>
  <!-- 테두리 대용 inset 그림자: ai-shadow로 세면 안 된다 -->
  <div><button class="chip">하나</button><button class="chip">둘</button><button class="chip">셋</button><button class="chip">넷</button><button class="chip">다섯</button><button class="chip">여섯</button><button class="chip">일곱</button></div>
  <!-- 두 줄 제목과 키 큰 한 줄 링크: ko-line-height 대상이 아니다 -->
  <h1>두 줄로 넘어가는 화면 제목 예시</h1>
  <a class="pill" href="#">가격 제안하기</a>
  <!-- 푸터의 합쇼체 법적 문구: 말투 섞임에서 빠진다 -->
  <p>예약이 끝났어요.</p>
  <footer><p>자리는 통신판매중개자이며 거래 당사자가 아닙니다.</p></footer>
</body></html>
